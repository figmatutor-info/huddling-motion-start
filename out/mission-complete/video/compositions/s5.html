  <script>
    const tl = gsap.timeline({ paused: true });
    const { f, motion, hold } = T;
    gsap.set(["#s5-phone", "#s5-card", "#s5-badge"], { opacity: 0 }); // 처음 상태 (타임라인 밖)

    // 0–32 screen-change: 제출 버튼이 커져 채움 → 04-approved (radius-button 8)
    let t = T.screenChange(tl, 0, { from: document.getElementById("s5-btn"), wrapper: document.getElementById("s5-btnwrap"),

    t += motion.emphasis.d; // 67
    // 67–73 배지 motion-enter · 73–94 hold-read
    tl.fromTo("#s5-badge", { opacity: 0 }, { opacity: 1, duration: motion.enter.d, ease: motion.enter.ease }, t);

    window.__timelines["s5"] = tl;
