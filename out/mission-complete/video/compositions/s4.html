  <script>
    const tl = gsap.timeline({ paused: true });
    const { f, motion, hold, pattern } = T;
    gsap.set("#s4-cardfill", { scaleX: 0.5 });
    gsap.set(["#s4-phone", "#s4-btn"], { opacity: 0 }); // 처음 상태 (타임라인 밖)
    // 0–32 screen-change: 카드 버튼이 커져 채움 → 03-mission (radius-button 8)
    let t = T.screenChange(tl, 0, { from: document.getElementById("s4-card-btn"), wrapper: document.getElementById("s4-wrap"),

    t += f(hold["hold-beat"]); // 32–37
    // 37–43 폰 motion-exit + 버튼 motion-enter
    tl.to("#s4-phone", { opacity: 0, duration: motion.exit.d, ease: motion.exit.ease }, t);
    tl.fromTo("#s4-btn", { opacity: 0 }, { opacity: 1, duration: motion.enter.d, ease: motion.enter.ease }, t);
    t += motion.enter.d + f(hold["hold-beat"]); // 43–48
    // 48–57 button-press
    const p = pattern.press;
    tl.to("#s4-btn", { scale: p.scale, duration: p.down.d, ease: p.down.ease }, t);
    tl.to("#s4-btn", { scale: 1, duration: p.up.d, ease: p.up.ease }, t + p.down.d);
    // 57–62 hold-beat
    tl.set({}, {}, t + p.down.d + p.up.d + f(hold["hold-beat"]));
    window.__timelines["s4"] = tl;
